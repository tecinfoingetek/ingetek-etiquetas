<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiqueta INGETEK</title>
<!-- Montserrat para títulos / Helvetica Neue se declara en font-family del body -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
/* ── RESET ── */
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── BODY: Helvetica Neue para cuerpo ── */
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #e8edf0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
}

/* ── BOTÓN IMPRESIÓN ── */
.btn-print {
  background: #1A1F25;               /* Azul Oscuro institucional */
  color: #ffffff;
  border: 2px solid #3DBAB3;         /* Turquesa INGETEK como acento */
  border-radius: 8px;
  padding: 12px 36px;
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  margin-bottom: 24px;
  transition: background 0.2s, border-color 0.2s;
}
.btn-print:hover {
  background: #32596E;               /* Azul Secundario en hover */
  border-color: #3DBAB3;
}

/* ═══════════════════════════════════════
   ETIQUETA CONTENEDOR
═══════════════════════════════════════ */
.etiqueta {
  width: 900px;
  border: 2px solid #3DBAB3;         /* Borde turquesa INGETEK */
  border-radius: 12px;
  overflow: hidden;
  background: #ffffff;
  box-shadow: 0 6px 28px rgba(26, 31, 38, 0.18);
}

/* ═══════════════════════════════════════
   CABECERA
═══════════════════════════════════════ */
.et-head {
  background: #1A1F25;               /* Azul Oscuro */
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  border-bottom: 3px solid #3DBAB3;  /* Línea turquesa separadora */
}

/* Logo + nombre */
.et-logo {
  display: flex;
  align-items: center;
  gap: 14px;
}

.et-logo-img {
  height: 54px;
  width: auto;
  object-fit: contain;
  /* Placeholder visual mientras no hay Base64 */
  background: rgba(61,186,179,0.12);
  border: 1px dashed #3DBAB3;
  border-radius: 4px;
  padding: 4px 8px;
}

.et-logo-text { display: flex; flex-direction: column; justify-content: flex-end; }
.et-brand-name {
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 3px;
  line-height: 1;
}
.et-brand-sub {
  font-family: 'Montserrat', sans-serif;
  color: #3DBAB3;                    /* Turquesa INGETEK */
  font-size: 9px;
  letter-spacing: 3.5px;
  font-weight: 700;
  margin-top: 3px;
  text-transform: uppercase;
}

/* Divisor vertical */
.et-div {
  width: 1px;
  height: 52px;
  background: #3DBAB3;               /* Turquesa como acento de separación */
  opacity: 0.5;
  margin: 0 18px;
}

/* Bloque derecho del header */
.et-title-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}
.et-icon-circle {
  background: rgba(61,186,179,0.15);  /* Fondo turquesa suave */
  border: 1.5px solid #3DBAB3;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.et-mant {
  font-family: 'Montserrat', sans-serif;
  color: #9eb8c8;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: right;
  text-transform: uppercase;
}
.et-prev {
  font-family: 'Montserrat', sans-serif;
  color: #3DBAB3;                    /* Turquesa para el título principal */
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
  text-align: right;
}

/* ═══════════════════════════════════════
   BODY (GRILLA 2 COLUMNAS)
═══════════════════════════════════════ */
.et-body {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  min-height: 280px;
}

/* ── COLUMNA IZQUIERDA ── */
.et-left {
  padding: 18px 22px;
  border-right: 2px solid #3DBAB3;  /* Turquesa como separador de columnas */
}

.et-id-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: #32596E;                    /* Azul Secundario */
  letter-spacing: 2px;
  text-transform: uppercase;
}
.et-id {
  font-family: 'Montserrat', sans-serif;
  font-size: 40px;
  font-weight: 900;
  color: #1A1F25;                    /* Azul Oscuro para ID */
  line-height: 1;
  margin: 4px 0 16px;
}

.et-info-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e0eaef;
}
.et-info-icon {
  font-size: 17px;
  flex-shrink: 0;
  margin-top: 2px;
}
.et-info-sub {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 700;
  color: #32596E;                    /* Azul Secundario */
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.et-info-val {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #1A1F25;                    /* Azul Oscuro - alto contraste */
}

/* Grid 2×2 datos técnicos */
.et-grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1.5px solid #3DBAB3;      /* Borde turquesa en tabla de datos */
  border-radius: 6px;
  overflow: hidden;
}
.et-cell { padding: 9px 13px; }
.et-cell:nth-child(odd)  { border-right: 1px solid #cde8e7; }
.et-cell:nth-child(n+3)  { border-top:  1px solid #cde8e7; }
.et-cell-lbl {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 700;
  color: #32596E;                    /* Azul Secundario */
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.et-cell-val {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 700;
  color: #1A1F25;                    /* Azul Oscuro */
  margin-top: 2px;
}

/* ── COLUMNA DERECHA ── */
.et-right {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Último mantenimiento */
.et-ult {
  background: #1A1F25;              /* Azul Oscuro como fondo */
  border: 2px solid #3DBAB3;        /* Turquesa como borde de acento */
  border-radius: 8px;
  padding: 11px 15px;
}
.et-ult-lbl {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 700;
  color: #3DBAB3;                   /* Turquesa para la etiqueta */
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.et-ult-fecha {
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
/* Línea separadora dentro del bloque */
.et-ult-sep {
  border: none;
  border-top: 1px solid rgba(61,186,179,0.3);
  margin: 6px 0;
}
/* Fecha exacta dd/mes/año */
.et-ult-detail {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  color: #3DBAB3;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
/* Fila de chips: Tipo · Proveedor */
.et-ult-chips {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 3px;
}
.et-ult-chip {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 700;
  background: rgba(61,186,179,0.15);
  color: #3DBAB3;
  border: 1px solid rgba(61,186,179,0.4);
  border-radius: 10px;
  padding: 2px 7px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
/* Folio + OC en monoespaciado */
.et-ult-folio {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.5px;
}

/* Próximo mantenimiento */
.et-prox {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1.5px solid #3DBAB3; /* Turquesa como separador */
}
.et-prox-lbl {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  font-weight: 700;
  color: #32596E;                   /* Azul Secundario */
  letter-spacing: 1px;
  text-transform: uppercase;
}
.et-prox-val {
  font-family: 'Montserrat', sans-serif;
  font-size: 16px;
  font-weight: 900;
  color: #1A1F25;                   /* Azul Oscuro */
}

/* Mantenimiento Obligatorio */
.et-oblig {
  border: 2px solid #3DBAB3;        /* Turquesa institucional */
  border-radius: 8px;
  overflow: hidden;
}
.et-oblig-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px;
  background: rgba(61,186,179,0.08); /* Fondo turquesa muy suave */
}
.et-oblig-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: #1A1F25;                   /* Azul Oscuro */

.et-oblig-months {

  text-align: center;
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 900;
  color: #1A1F25;                   /* Texto oscuro sobre turquesa - contraste */
  padding: 6px;
  letter-spacing: 2px;
}

/* Caja escanear / QR */
.et-scan-box {
  background: #32596E;              /* Azul Secundario como fondo */
  border-radius: 8px;
  padding: 11px 13px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.et-scan-left { flex: 1; }
.et-scan-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 5px;
  letter-spacing: 1px;
}
.et-scan-item {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  color: #b8d8e8;
  margin-bottom: 2px;
}
.et-scan-item::before {
  content: "● ";
  color: #3DBAB3;                   /* Turquesa como viñeta */
}
.et-scan-btn {
  background: #3DBAB3;              /* Turquesa */
  color: #1A1F25;                   /* Texto oscuro para contraste */
  border-radius: 5px;
  padding: 5px 9px;
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 700;
  margin-top: 6px;
  display: inline-block;
  letter-spacing: 0.5px;
}
.et-qr-wrap {
  flex-shrink: 0;
  background: white;
  padding: 5px;
  border-radius: 6px;
  border: 2px solid #3DBAB3;       /* Borde turquesa en el QR */
}

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */
.et-foot {
  background: #1A1F25;              /* Azul Oscuro */
  border-top: 3px solid #3DBAB3;   /* Línea turquesa separadora */
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 9px 22px;
  gap: 16px;
}
.et-status-lbl {
  font-family: 'Montserrat', sans-serif;
  color: #3DBAB3;                   /* Turquesa */
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.et-status-badge {
  font-family: 'Montserrat', sans-serif;
  color: #ffffff;
  border-radius: 20px;
  padding: 5px 18px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 4px;
  display: inline-block;
  letter-spacing: 0.5px;
}
.et-foot-center {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: #6a8a9a;
  font-size: 8px;
  text-align: center;
  letter-spacing: 0.5px;
}
.et-web {
  font-family: 'Montserrat', sans-serif;
  color: #3DBAB3;                   /* Turquesa para el sitio web */
  font-size: 11px;
  font-weight: 700;
  text-align: right;
  letter-spacing: 1px;
